name: immich

services:
  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:?Set IMMICH_VERSION}@sha256:485d546a2e31d6a8b4db8423fcba5c109de8c218d93410af115fd1ccfc4352a6
    volumes:
      - type: bind
        source: ${UPLOAD_LOCATION:?Set UPLOAD_LOCATION}
        target: /data
        bind: { create_host_path: false }
      - type: bind
        source: ${BACKUP_LOCATION:?Set BACKUP_LOCATION}
        target: /data/backups
        bind: { create_host_path: false }
      - type: bind
        source: ${EXTERNAL_LOCATION:?Set EXTERNAL_LOCATION}
        target: /ext-archive
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ${IMMICH_CACHE_LOCATION:?Set IMMICH_CACHE_LOCATION}
        target: /cache
        bind: { create_host_path: false }
      - type: bind
        source: ${IMMICH_CONFIG_LOCATION:?Set IMMICH_CONFIG_LOCATION}
        target: /config
        bind: { create_host_path: false }
      - type: bind
        source: /etc/localtime
        target: /etc/localtime
        read_only: true
        bind: { create_host_path: false }
    env_file: [.env]
    environment:
      DB_HOSTNAME: database
      REDIS_HOSTNAME: redis
      IMMICH_CONFIG_FILE: /config/immich.json
    ports: ["2283:2283"]
    depends_on:
      database: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: "no"

  immich-machine-learning:
    container_name: immich_machine_learning
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:?Set IMMICH_VERSION}@sha256:5b28c9352c8374b8a1ed96fbdd8d6755fea6e43510ec43fdf6538aa02ea40f56
    volumes:
      - type: bind
        source: ${IMMICH_CACHE_LOCATION:?Set IMMICH_CACHE_LOCATION}
        target: /cache
        bind: { create_host_path: false }
    restart: unless-stopped

  redis:
    container_name: immich_redis
    image: docker.io/valkey/valkey:9@sha256:c123e3715db63d06d4ad6964884037aa0d5d4d703939b9929954112889708e1d
    volumes:
      - immich-valkey-v3-335:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  database:
    container_name: immich-postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    env_file: [.env]
    environment:
      POSTGRES_USER: ${DB_USERNAME:?Set DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME:?Set DB_DATABASE_NAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      POSTGRES_INITDB_ARGS: --data-checksums
    command: [postgres, -c, config_file=/etc/postgresql/postgresql.conf, -c, max_connections=50]
    shm_size: 128mb
    volumes:
      - type: bind
        source: ${DB_DATA_LOCATION:?Set DB_DATA_LOCATION}
        target: /var/lib/postgresql/data
        bind: { create_host_path: false }
    restart: unless-stopped

volumes:
  immich-valkey-v3-335:
    name: immich-valkey-v3-335
