name: Immich stable release review

on:
  schedule:
    - cron: "17 15 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: immich-stable-release-review
  cancel-in-progress: false

jobs:
  prepare-review:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check official stable release and pin image digests
        id: release
        run: python3 scripts/propose-immich-update.py .

      - name: Open or refresh a draft review pull request
        if: steps.release.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ steps.release.outputs.latest }}
          CURRENT: ${{ steps.release.outputs.current }}
        run: |
          set -euo pipefail
          branch="bot/immich-stable-${RELEASE}"
          existing="$(gh pr list --state open --head "$branch" --json url --jq '.[0].url // empty')"
          if [[ -n "$existing" ]]; then
            echo "A review PR for ${RELEASE} is already open: ${existing}"
            exit 0
          fi

          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            branch="${branch}-${GITHUB_RUN_ID}"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add immich-app/docker-compose.yml immich-app/.env.example
          git commit -m "chore(immich): propose ${RELEASE}"
          git push origin "$branch"
          body_file="$RUNNER_TEMP/immich-update-pr.md"
          cat > "$body_file" <<EOF
          ## Automated release proposal

          This draft was generated from Immich's official stable GitHub release and GHCR image manifest digests. It only updates repository deployment templates; it does not deploy to the Mac mini.

          Before marking ready, review the [official release notes](https://github.com/immich-app/immich/releases/tag/${RELEASE}), confirm any intermediate-upgrade requirements and database compatibility, and reconcile the repository templates with the live Mac mini configuration. Require a fresh verified database backup, storage checks, and the Motion Photo/external-library verification plan before any production rollout.

          Do not merge or apply solely because this PR was generated.
          EOF

          gh pr create --draft \
            --title "Review Immich ${RELEASE} (current ${CURRENT})" \
            --body-file "$body_file"

